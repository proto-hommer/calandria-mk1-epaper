<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1010" width="720" height="1010" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="1010" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Encoder EC11 → pads del ES8311 (codec desoldado)</text>
  <text x="360" y="72" text-anchor="middle" font-size="14" fill="#555">Encoder visto desde arriba. Pull-ups internos del ESP32: no lleva resistencias.</text>

  <!-- ===== Encoder (top view) ===== -->
  <rect x="300" y="150" width="160" height="220" rx="6" fill="#5b8fd9" stroke="#1d3f73" stroke-width="2"/>
  <circle cx="380" cy="260" r="38" fill="#3f6fb5" stroke="#1d3f73" stroke-width="2"/>
  <path d="M352 255 h56 a28 28 0 0 1 -56 0 z" fill="#2c5592"/>
  <!-- switch symbol between D and E -->
  <path d="M440 220 v22 M440 278 v22" stroke="#fff" stroke-width="2"/>
  <circle cx="440" cy="246" r="3" fill="#fff"/><circle cx="440" cy="274" r="3" fill="#fff"/>
  <path d="M446 244 l8 16 M454 252 v10" stroke="#fff" stroke-width="2" fill="none"/>

  <!-- pins -->
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#111">
    <circle cx="300" cy="190" r="16" fill="#fff" stroke="#111" stroke-width="2"/><text x="300" y="195">A</text>
    <circle cx="300" cy="260" r="16" fill="#fff" stroke="#111" stroke-width="2"/><text x="300" y="265">C</text>
    <circle cx="300" cy="330" r="16" fill="#fff" stroke="#111" stroke-width="2"/><text x="300" y="335">B</text>
    <circle cx="460" cy="220" r="16" fill="#fff" stroke="#111" stroke-width="2"/><text x="460" y="225">D</text>
    <circle cx="460" cy="300" r="16" fill="#fff" stroke="#111" stroke-width="2"/><text x="460" y="305">E</text>
  </g>
  <g font-size="12" fill="#fff">
    <text x="322" y="194">A</text>
    <text x="322" y="264">común</text>
    <text x="322" y="334">B</text>
    <text x="380" y="355" text-anchor="middle">pulsador D–E</text>
  </g>

  <!-- ===== GND: C and D ===== -->
  <g stroke="#111" stroke-width="2.5" fill="none">
    <!-- C -> GND -->
    <path d="M284 260 H230 V282"/>
    <path d="M214 282 h32 M220 289 h20 M226 296 h8"/>
    <!-- D -> GND -->
    <path d="M476 220 H560 V242"/>
    <path d="M544 242 h32 M550 249 h20 M556 256 h8"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#111">
    <text x="196" y="287" text-anchor="end">GND</text>
    <text x="584" y="247">GND</text>
  </g>

  <!-- ===== ES8311 footprint ===== -->
  <rect x="230" y="520" width="300" height="280" fill="#fff6c8" stroke="#8a6d00" stroke-width="2"/>
  <text x="420" y="590" text-anchor="middle" font-size="18" font-weight="bold" fill="#5a4700">ES8311 (U10)</text>
  <text x="420" y="612" text-anchor="middle" font-size="12" fill="#5a4700">chip retirado:</text>
  <text x="420" y="628" text-anchor="middle" font-size="12" fill="#5a4700">se suelda a sus pads</text>

  <g stroke="#8a6d00" stroke-width="2">
    <!-- left 1-5 -->
    <path d="M190 560 h40 M190 600 h40 M190 640 h40 M190 680 h40 M190 720 h40"/>
    <!-- bottom 6-10 -->
    <path d="M290 800 v40 M340 800 v40 M390 800 v40 M440 800 v40 M490 800 v40"/>
    <!-- right 11-15 -->
    <path d="M530 560 h40 M530 600 h40 M530 640 h40 M530 680 h40 M530 720 h40"/>
    <!-- top 16-20 -->
    <path d="M290 480 v40 M340 480 v40 M390 480 v40 M440 480 v40 M490 480 v40"/>
  </g>
  <g font-size="11" fill="#8a6d00">
    <text x="210" y="554" text-anchor="middle">1</text><text x="210" y="594" text-anchor="middle">2</text>
    <text x="210" y="634" text-anchor="middle">3</text><text x="210" y="674" text-anchor="middle">4</text>
    <text x="210" y="714" text-anchor="middle">5</text>
    <text x="283" y="834" text-anchor="end">6</text><text x="333" y="834" text-anchor="end">7</text>
    <text x="383" y="834" text-anchor="end">8</text><text x="433" y="834" text-anchor="end">9</text>
    <text x="483" y="834" text-anchor="end">10</text>
    <text x="550" y="554" text-anchor="middle">15</text><text x="550" y="594" text-anchor="middle">14</text>
    <text x="550" y="634" text-anchor="middle">13</text><text x="550" y="674" text-anchor="middle">12</text>
    <text x="550" y="714" text-anchor="middle">11</text>
    <text x="283" y="496" text-anchor="end">20</text><text x="333" y="496" text-anchor="end">19</text>
    <text x="383" y="496" text-anchor="end">18</text><text x="433" y="496" text-anchor="end">17</text>
    <text x="483" y="496" text-anchor="end">16</text>
  </g>
  <!-- pin names -->
  <g font-size="12" fill="#999">
    <text x="240" y="564">CCLK</text>
    <text x="240" y="644">PVDD</text>
    <text x="240" y="684">DVDD</text>
    <text x="240" y="724">DGND</text>
    <text transform="translate(344 790) rotate(-90)">ASDOUT</text>
    <text transform="translate(444 790) rotate(-90)">DSDIN</text>
    <text transform="translate(494 790) rotate(-90)">AGND</text>
  </g>
  <g font-size="12" font-weight="bold">
    <text x="240" y="604" fill="#8a2be2">MCLK · GPIO14</text>
    <text transform="translate(294 790) rotate(-90)" fill="#d62828">SCLK · GPIO15</text>
    <text transform="translate(394 790) rotate(-90)" fill="#2a9d3a">LRCK · GPIO38</text>
  </g>

  <!-- ===== Signal wires ===== -->
  <g fill="none" stroke-width="3.5" stroke-linejoin="round">
    <!-- A -> pad 6 (SCLK, GPIO15) -->
    <path d="M284 190 H100 V900 H290 V840" stroke="#d62828"/>
    <!-- B -> pad 8 (LRCK, GPIO38), hops over A -->
    <path d="M284 330 H120 V880 H281 A9 9 0 0 1 299 880 H390 V840" stroke="#2a9d3a"/>
    <!-- E (switch) -> pad 2 (MCLK, GPIO14) -->
    <path d="M476 300 H610 V440 H160 V600 H190" stroke="#8a2be2"/>
  </g>
  <g>
    <circle cx="190" cy="600" r="5" fill="#8a2be2"/>
    <circle cx="290" cy="840" r="5" fill="#d62828"/>
    <circle cx="390" cy="840" r="5" fill="#2a9d3a"/>
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="14" fill="#111">
    <rect x="40" y="938" width="22" height="5" fill="#d62828"/><text x="70" y="945">A → pad 6 (SCLK) · GPIO15</text>
    <rect x="290" y="938" width="22" height="5" fill="#2a9d3a"/><text x="320" y="945">B → pad 8 (LRCK) · GPIO38</text>
    <rect x="40" y="968" width="22" height="5" fill="#8a2be2"/><text x="70" y="975">E → pad 2 (MCLK) · GPIO14</text>
    <rect x="290" y="968" width="22" height="5" fill="#111"/><text x="320" y="975">C (común) y D → GND de la placa</text>
  </g>
</svg>
