; Calandria MK1 epaper: Waveshare ESP32-S3-ePaper-1.54 (no touch) + hand-wired Wio-SX1262.
; N8R8: 8 MB QIO flash, 8 MB octal PSRAM. Console is USB CDC (GPIO43/44 are the radio SPI).

[calandria_mk1_epaper]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_level = extra
board_build.partitions = ${PROJECT_DIR}/default_8MB.csv
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D WAVESHARE_EPAPER_154
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; Message history (all channels and DMs together). The default 20 is gone in minutes on a busy channel,
  ; taking DMs with it; 50 costs ~11 KB of RAM for the text pool.
  -D MESSAGE_HISTORY_LIMIT=50
  -I variants/esp32s3/calandria_mk1_epaper
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/calandria_mk1_epaper>
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
  https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip

[env:calandria-mk1-epaper-headless]
extends = calandria_mk1_epaper
build_flags =
  ${calandria_mk1_epaper.build_flags}
  -D HAS_SCREEN=0

[env:calandria-mk1-epaper]
extends = calandria_mk1_epaper, inkhud
build_src_filter =
  ${esp32s3_base.build_src_filter}
  ${inkhud.build_src_filter}
  +<../variants/esp32s3/calandria_mk1_epaper>
build_flags =
  ${calandria_mk1_epaper.build_flags}
  ${inkhud.build_flags}
lib_deps =
  ${inkhud.lib_deps}
  ${calandria_mk1_epaper.lib_deps}
